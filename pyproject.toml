[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dll-forward-gen"
version = "0.1.0"
description = "Fast, zero-dependency PE export forwarder & C++ proxy stub generator for Windows"
readme = "README.md"
authors = [{ name = "NEGG0", email = "rokmit599@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["windows", "pe", "dll", "proxy", "forwarding", "reverse-engineering", "cpp20", "ntapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Operating System",
]

[project.urls]
Homepage = "https://github.com/negg0s/dll-forward-gen"
Repository = "https://github.com/negg0s/dll-forward-gen.git"

[project.scripts]
dll-forward-gen = "dll_forward_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
