name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ Native Engine
        shell: cmd
        run: |
          cd cpp
          cl.exe /nologo /O2 /W4 /std:c++20 /EHsc dll_forward_gen.cpp /Fe:dll-forward-gen.exe

      - name: Package Native Windows Executable Zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          $staging = "dll-forward-gen-windows-x64"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "cpp/dll-forward-gen.exe" -Destination "$staging/dll-forward-gen.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination $staging }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination $staging }
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/dll-forward-gen-windows-x64.zip"

      - name: Build Python Distribution Packages (Wheel and Sdist)
        shell: cmd
        run: |
          pip install --upgrade build
          python -m build

      - name: Generate Checksums
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 dist/* | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Path "dist/checksums-sha256.txt" -Encoding utf8
          Get-Content "dist/checksums-sha256.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
