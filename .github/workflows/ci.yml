name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONPATH: src

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Package in Editable Mode
      shell: cmd
      run: pip install -e .

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Run Python Automated Test Suite
      shell: pwsh
      run: |
        $env:PYTHONPATH="src;."
        python -m unittest discover -s tests -v

    - name: Compile and Test Native C++20 Engine
      shell: cmd
      run: |
        cd cpp
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc dll_forward_gen.cpp /Fe:dll-forward-gen.exe
        dll-forward-gen.exe C:\Windows\System32\version.dll --dump
        dll-forward-gen.exe C:\Windows\System32\version.dll -m masm -o cpp_masm_out
        dll-forward-gen.exe C:\Windows\System32\version.dll -H cpp_version_forward.h

    - name: Compile and Run C++ SDK Tests
      shell: cmd
      run: |
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_inline_hook.cpp /Fe:test_inline_hook.exe
        test_inline_hook.exe
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_pattern_scan.cpp /Fe:test_pattern_scan.exe
        test_pattern_scan.exe
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_iat_hook.cpp /Fe:test_iat_hook.exe
        test_iat_hook.exe
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_eat_hook.cpp /Fe:test_eat_hook.exe
        test_eat_hook.exe
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_veh_hook.cpp /Fe:test_veh_hook.exe
        test_veh_hook.exe
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_stealth.cpp /Fe:test_stealth.exe
        test_stealth.exe
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_lde.cpp /Fe:test_lde.exe
        test_lde.exe
        cl.exe /nologo /O2 /W4 /std:c++20 /EHsc tests\test_pe_loader.cpp /Fe:test_pe_loader.exe
        test_pe_loader.exe

    - name: End-to-End MASM Compilation Check
      shell: cmd
      run: |
        python -m dll_forward_gen version.dll -o e2e_proxy -m masm --file-log
        cd e2e_proxy
        ml64.exe /c /nologo /Fostubs.obj stubs.asm
        cl.exe /nologo /O2 /W4 /LD dllmain.cpp stubs.obj /DEF:exports.def /Fe:version.dll /link /MACHINE:X64
